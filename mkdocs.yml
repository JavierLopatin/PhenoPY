site_name: PhenoSensing
site_description: Land surface phenology metrics from satellite image time series
repo_url: https://github.com/JavierLopatin/PhenoSensing
repo_name: JavierLopatin/PhenoSensing

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true
            members_order: source

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Methods & references: methods.md
  - Performance: performance.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
